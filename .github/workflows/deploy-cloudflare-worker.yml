name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sub-Store
        uses: actions/checkout@v4
        with:
          path: Sub-Store
          fetch-depth: 1

      - name: Checkout Workers adapter
        uses: actions/checkout@v4
        with:
          repository: Yu9191/sub-store-workers
          path: sub-store-workers
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Configure upstream pnpm build scripts
        working-directory: Sub-Store/backend
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'pnpm-workspace.yaml';
          const approved = ['core-js', 'esbuild', 'nodemon'];
          let text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
          text = text.replace(/^onlyBuiltDependencies:\n(?:[ \t].*(?:\n|$))*/m, '');
          if (!/^packages:/m.test(text)) {
            text = `packages:\n  - .\n${text.trim() ? `\n${text.trimStart()}` : ''}`;
          }
          if (!/^allowBuilds:/m.test(text)) {
            text = `${text.replace(/\s*$/, '')}\nallowBuilds:\n`;
          }
          for (const name of approved) {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`^(\\s*${escaped}\\s*:\\s*).*$`, 'm');
            if (pattern.test(text)) {
              text = text.replace(pattern, `$1true`);
            } else {
              text = text.replace(/^allowBuilds:\n/m, `allowBuilds:\n  ${name}: true\n`);
            }
          }
          fs.writeFileSync(file, text);
          NODE

      - name: Install Sub-Store dependencies
        working-directory: Sub-Store/backend
        run: pnpm install --no-frozen-lockfile

      - name: Install Workers adapter dependencies
        working-directory: sub-store-workers
        run: npm ci

      - name: Build Worker
        working-directory: sub-store-workers
        run: npm run build

      - name: Generate wrangler.toml
        working-directory: sub-store-workers
        run: |
          cat > wrangler.toml <<'TOML'
          name = "sub-store"
          main = "dist/worker.js"
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat"]

          [[kv_namespaces]]
          binding = "SUB_STORE_DATA"
          id = "__KV_NAMESPACE_ID__"

          [[routes]]
          pattern = "sub.150050.xyz/*"
          custom_domain = true

          [triggers]
          crons = ["55 15 * * *"]

          [vars]
          SCRIPT_ENGINE = "quickjs"
          SUB_STORE_BACKEND_CUSTOM_NAME = "Workers"
          SUB_STORE_BACKEND_CUSTOM_ICON = "https://cdn.jsdelivr.net/gh/Yu9191/sub-store-workers@main/png/cloudflare.png"
          TOML
          sed -i 's/^          //' wrangler.toml
          sed -i "s/__KV_NAMESPACE_ID__/${{ secrets.KV_NAMESPACE_ID }}/" wrangler.toml

      - name: Deploy Worker
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set Worker secret
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUB_STORE_FRONTEND_BACKEND_PATH: ${{ secrets.SUB_STORE_FRONTEND_BACKEND_PATH }}
        run: printf '%s' "$SUB_STORE_FRONTEND_BACKEND_PATH" | npx wrangler secret put SUB_STORE_FRONTEND_BACKEND_PATH

      - name: Redeploy Worker with secret
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Health check
        run: |
          URL="https://sub.150050.xyz${{ secrets.SUB_STORE_FRONTEND_BACKEND_PATH }}/api/utils/worker-status"
          for i in 1 2 3; do
            sleep 10
            CODE=$(curl -s -o /tmp/worker-status.json -w "%{http_code}" "$URL")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/worker-status.json
              exit 0
            fi
          done
          cat /tmp/worker-status.json || true
          exit 1
