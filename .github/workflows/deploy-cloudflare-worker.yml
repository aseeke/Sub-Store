name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - master
  workflow_run:
    workflows:
      - Sync upstream
    types:
      - completed

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WORKER_NAME: sub-store
  WORKER_DOMAIN: sub.150050.xyz
  KV_NAMESPACE_TITLE: sub-store-data
  SUB_STORE_FRONTEND_BACKEND_PATH: /

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Sub-Store
        uses: actions/checkout@v4
        with:
          path: Sub-Store
          fetch-depth: 1

      - name: Checkout Workers adapter
        uses: actions/checkout@v4
        with:
          repository: Yu9191/sub-store-workers
          path: sub-store-workers
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Configure upstream pnpm build scripts
        working-directory: Sub-Store/backend
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'pnpm-workspace.yaml';
          const approved = ['core-js', 'esbuild', 'nodemon'];
          let text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
          text = text.replace(/^onlyBuiltDependencies:\n(?:[ \t].*(?:\n|$))*/m, '');
          if (!/^packages:/m.test(text)) {
            text = `packages:\n  - .\n${text.trim() ? `\n${text.trimStart()}` : ''}`;
          }
          if (!/^allowBuilds:/m.test(text)) {
            text = `${text.replace(/\s*$/, '')}\nallowBuilds:\n`;
          }
          for (const name of approved) {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`^(\\s*${escaped}\\s*:\\s*).*$`, 'm');
            if (pattern.test(text)) {
              text = text.replace(pattern, `$1true`);
            } else {
              text = text.replace(/^allowBuilds:\n/m, `allowBuilds:\n  ${name}: true\n`);
            }
          }
          fs.writeFileSync(file, text);
          NODE

      - name: Install Sub-Store dependencies
        working-directory: Sub-Store/backend
        run: pnpm install --no-frozen-lockfile

      - name: Install Workers adapter dependencies
        working-directory: sub-store-workers
        run: npm ci

      - name: Build Worker
        working-directory: sub-store-workers
        run: npm run build

      - name: Create or reuse KV Namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          headers=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          response=$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api")
          namespace_id=$(printf '%s' "$response" | jq -r --arg title "$KV_NAMESPACE_TITLE" '.result[] | select(.title == $title) | .id' | head -n 1)
          if [ -z "$namespace_id" ]; then
            response=$(curl --fail-with-body --silent --show-error "${headers[@]}" -X POST --data "{\"title\":\"${KV_NAMESPACE_TITLE}\"}" "$api")
            namespace_id=$(printf '%s' "$response" | jq -r '.result.id')
          fi
          test -n "$namespace_id" && test "$namespace_id" != "null"
          echo "id=$namespace_id" >> "$GITHUB_OUTPUT"
          echo "Using KV namespace ${KV_NAMESPACE_TITLE}."

      - name: Generate wrangler.toml
        working-directory: sub-store-workers
        env:
          KV_NAMESPACE_ID: ${{ steps.kv.outputs.id }}
        run: |
          cat > wrangler.toml <<TOML
          name = "${WORKER_NAME}"
          main = "dist/worker.js"
          compatibility_date = "2026-09-08"
          compatibility_flags = ["nodejs_compat"]

          [[kv_namespaces]]
          binding = "SUB_STORE_DATA"
          id = "${KV_NAMESPACE_ID}"

          [[routes]]
          pattern = "${WORKER_DOMAIN}"
          custom_domain = true

          [triggers]
          crons = ["55 15 * * *"]

          [vars]
          SCRIPT_ENGINE = "quickjs"
          SUB_STORE_FRONTEND_BACKEND_PATH = "${SUB_STORE_FRONTEND_BACKEND_PATH}"
          SUB_STORE_BACKEND_CUSTOM_NAME = "Sub-Store"
          SUB_STORE_BACKEND_CUSTOM_ICON = "https://cdn.jsdelivr.net/gh/Yu9191/sub-store-workers@main/png/cloudflare.png"
          TOML
          sed -i 's/^          //' wrangler.toml

      - name: Deploy Worker
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Health check
        run: |
          URL="https://${WORKER_DOMAIN}${SUB_STORE_FRONTEND_BACKEND_PATH%/}/api/utils/worker-status"
          for i in 1 2 3; do
            sleep 10
            CODE=$(curl -s -o /tmp/worker-status.json -w "%{http_code}" "$URL")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/worker-status.json
              exit 0
            fi
          done
          cat /tmp/worker-status.json || true
          exit 1
